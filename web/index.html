<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Zelvo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="top">
            <div class="logo">🍃</div>

            <div>
                <h1>ZELVO</h1>
                <span>Mining & Rewards</span>
            </div>
        </header>

        <main>

            <section class="balance-card">
                <div class="small-title">إجمالي الرصيد</div>

                <div class="balance">
                    0 <span>ZELVO</span>
                </div>

                <div class="mining-status">
                    <span>⚡ سرعة التعدين</span>
                    <strong>0 ZELVO / ساعة</strong>
                </div>
            </section>

            <button class="mine-button" id="mineButton">
                <div class="pickaxe">⛏️</div>

                <strong>ابدأ التعدين</strong>

                <span>اجمع ZELVO</span>
            </button>

            <section class="stats">

                <div class="stat">
                    <div>🎁</div>
                    <strong>0</strong>
                    <span>المكافأة</span>
                </div>

                <div class="stat">
                    <div>👥</div>
                    <strong>0</strong>
                    <span>الأصدقاء</span>
                </div>

                <div class="stat">
                    <div>📋</div>
                    <strong>0</strong>
                    <span>المهام</span>
                </div>

            </section>

            <section class="menu-grid">

                <button>
                    🎁
                    <span>المكافآت</span>
                </button>

                <button>
                    👥
                    <span>الأصدقاء</span>
                </button>

                <button>
                    🚀
                    <span>ترقية السرعة</span>
                </button>

                <button>
                    🏆
                    <span>المتصدرين</span>
                </button>

            </section>

        </main>

        <nav class="bottom-nav">

            <button class="active">
                🏠
                <span>الرئيسية</span>
            </button>

            <button>
                ⛏️
                <span>التعدين</span>
            </button>

            <button>
                🎁
                <span>المكافآت</span>
            </button>

            <button>
                👤
                <span>حسابي</span>
            </button>

        </nav>

    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>

</body>
</html>
